name: Aplicar RC3.3 Online

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Confirmo que quero preparar a RC3.3 em uma branch/PR"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preparar-rc33:
    if: ${{ inputs.confirmar == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar base RC3.2
        shell: bash
        run: |
          set -euo pipefail
          BASE="fc029a351692472828218f4faf9c79f7e3d4b57d"
          TARGETS=(
            "android/app/build.gradle.kts"
            "android/app/src/main/java/com/bigcorps/driveraimvp/MediaProjectionOcrService.kt"
            "android/app/src/main/java/com/bigcorps/driveraimvp/NowPanel023.kt"
            "android/app/src/main/java/com/bigcorps/driveraimvp/FieldValidationPolish0265.kt"
            "android/app/src/main/java/com/bigcorps/driveraimvp/ReleasePolish0270.kt"
            "android/app/src/main/java/com/bigcorps/driveraimvp/HistoryPanel.kt"
            "android/app/src/main/java/com/bigcorps/driveraimvp/RegionalClient.kt"
            "android/app/src/main/java/com/bigcorps/driveraimvp/DiagnosticBundle.kt"
            "backend/app/admin/importacoes/page.module.css"
          )

          if ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::O main atual não descende da base RC3.2 validada $BASE. Nada será aplicado."
            exit 1
          fi

          if ! git diff --quiet "$BASE"..HEAD -- "${TARGETS[@]}"; then
            echo "::error::Um ou mais arquivos-base da RC3.3 mudaram depois de $BASE. Nada será aplicado automaticamente."
            git diff --stat "$BASE"..HEAD -- "${TARGETS[@]}"
            exit 1
          fi

          grep -q 'versionCode = 60' android/app/build.gradle.kts
          grep -q 'versionName = "0.27.0-rc3.2"' android/app/build.gradle.kts
          echo "Base RC3.2 confirmada."

