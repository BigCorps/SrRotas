      - name: Aplicar RC3.3 na cópia de trabalho
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/rc33-installer/apply_rc33.py" "$GITHUB_WORKSPACE" --allow-dirty-head

      - name: Validar versão e guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 61' android/app/build.gradle.kts
          grep -q 'versionName = "0.27.0-rc3.3"' android/app/build.gradle.kts
          grep -q 'ShadowOfferRecovery027033.submit' android/app/src/main/java/com/bigcorps/driveraimvp/MediaProjectionOcrService.kt
          grep -q 'sr-rotas-diagnostic-v7' android/app/src/main/java/com/bigcorps/driveraimvp/DiagnosticBundle.kt
          grep -q 'V7.1 · CONTRATO DE DADOS' backend/app/admin/importacoes/page.tsx
          grep -q 'financial_ready' backend/src/admin-imports.ts
          grep -q 'sr_historical_import_quality_summary_v1' supabase/migrations/20260913_historical_import_contract_v1_027033.sql

          # Os parsers congelados não podem ter sido alterados nesta rodada.
          git diff --quiet fc029a351692472828218f4faf9c79f7e3d4b57d --             android/app/src/main/java/com/bigcorps/driveraimvp/OfferParser.kt             android/app/src/main/java/com/bigcorps/driveraimvp/UberSpatialParser0221.kt             android/app/src/main/java/com/bigcorps/driveraimvp/OfferDeduplicator.kt

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend — instalar e checar TypeScript
        working-directory: backend
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run check

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android — testes + debug APK de validação
        working-directory: android
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:assembleDebug --stacktrace

      - name: Preparar branch final sem o instalador temporário
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="rc33-online-ready-${GITHUB_RUN_ID}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          # O próprio workflow é temporário e desaparece no PR final.
          rm -f .github/workflows/srrotas-rc33-online.yml

          git add -A
          git commit -m "Sr. Rotas 0.27.0 RC3.3 — integridade de coleta e V7.1"
          git push --set-upstream origin "$BRANCH"

      - name: Abrir Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/rc33-pr-body.md"
          cat > "$BODY" <<'EOF'
          ## Sr. Rotas 0.27.0-RC3.3

          RC3.3 preparada automaticamente a partir da base RC3.2 validada.

          ### Antes de mesclar
          **Aplicar manualmente no Supabase SQL Editor:**
          `supabase/migrations/20260913_historical_import_contract_v1_027033.sql`

          ### Validações executadas no GitHub Actions antes de abrir este PR
          - base RC3.2 e arquivos-alvo conferidos;
          - aplicador fail-closed;
          - TypeScript `npm run check` (dependências instaladas sem criar lockfile);
          - testes Android `:app:testDebugUnitTest`;
          - `:app:assembleDebug`;
          - parsers congelados preservados;
          - versão Android 61 / 0.27.0-rc3.3;
          - Admin/importador V7.1 presente.

          ### Depois do merge
          O workflow normal `Android CI + Field APK` deve rodar por causa das alterações em `android/**` e gerar o APK de campo.
          EOF

          if PR_URL=$(gh pr create             --base main             --head "$BRANCH"             --title "Sr. Rotas 0.27.0-RC3.3 — Integridade de Coleta + V7.1"             --body-file "$BODY"); then
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "### Pull Request criado" >> "$GITHUB_STEP_SUMMARY"
            echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "**Não faça merge antes de aplicar a migration Supabase.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::A branch foi criada e enviada, mas a criação automática do PR foi bloqueada pelas permissões do repositório. Abra manualmente um PR da branch $BRANCH para main."
            echo "### Branch RC3.3 criada" >> "$GITHUB_STEP_SUMMARY"
            echo "Abra manualmente um PR de **$BRANCH** para **main**." >> "$GITHUB_STEP_SUMMARY"
          fi
