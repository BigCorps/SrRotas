name: Radar Backend Tests

on:
  push:
    branches-ignore:
      - feature/integration-vc100-statistics
    paths:
      - "backend/**"
      - "supabase/migrations/*radar_collector_hardening_v2.sql"
      - "docs/contracts/RADAR-EXTERNAL-COLLECTOR-V2*"
      - ".github/workflows/radar-backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "supabase/migrations/*radar_collector_hardening_v2.sql"
      - "docs/contracts/RADAR-EXTERNAL-COLLECTOR-V2*"
      - ".github/workflows/radar-backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  radar-backend:
    name: Radar / Tests, TypeScript and Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
      PAIRING_CODE: ci-placeholder-pairing
      CRON_SECRET: ci-placeholder-cron
      NEXT_PUBLIC_SITE_URL: https://srrotas.com
      NEXT_PUBLIC_INDEX_SITE: "false"
      MCP_PUBLIC_BASE_URL: https://srrotas.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Radar backend tests
        run: npm run test:radar

      - name: Isolated PostgreSQL and HTTP checks
        run: npm run test:radar:isolated

      - name: Statistics regression tests
        run: npm run test:statistics

      - name: TypeScript typecheck
        run: npm run check

      - name: Next.js production build
        run: npm run build
