name: History original evidence checks
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/history-evidence-checks.yml'
permissions:
  contents: read
jobs:
  history-evidence:
    if: github.head_ref == 'fix/history-original-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Architecture and unchanged Reader / OCR / HUD / recovery
        run: |
          bash scripts/check-architecture.sh
          git diff --exit-code 4a8f384c0cb755f93af315b651b08000b9f502fa -- app/src/main/java/com/bigcorps/driveraimvp/MediaProjectionOcrService.kt app/src/main/java/com/bigcorps/driveraimvp/OfferDispatcher.kt app/src/main/java/com/bigcorps/driveraimvp/JourneyBubbleController.kt app/src/main/java/com/bigcorps/driveraimvp/OverlayController.kt app/src/main/java/com/bigcorps/driveraimvp/r3lab/R3Supervisor.kt app/src/main/java/com/bigcorps/driveraimvp/r3lab/R3Mode.kt app/src/main/java/com/bigcorps/driveraimvp/r3lab/R3LabStorage.kt
      - name: Compile and relevant history, evidence, recovery and concurrency tests
        run: >-
          gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest
          --tests '*OriginalCaptureLookupTest' --tests '*R3PrimaryTest' --tests '*R3LabStorageTest'
          --tests '*R3LabConcurrencyTest' --tests '*ReaderHealth113Test'
          --tests '*HistoryReview109Test' --tests '*HistoryCapture111Test' --tests '*HistoryReview111Test'
          --tests '*Field114IntegrationTest' --stacktrace
      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          suites = [ET.parse(p).getroot() for p in Path('app/build/test-results').rglob('TEST-*.xml')]
          print('HISTORY_EVIDENCE_TESTS ' + json.dumps({k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests','failures','errors','skipped')}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-evidence-test-results
          path: android/app/build/test-results/
          retention-days: 14
