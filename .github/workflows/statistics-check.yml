name: Statistics Integrated Check

on:
  push:
    branches:
      - feature/integration-vc100-statistics
    paths:
      - "backend/**"
      - ".github/workflows/statistics-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statistics-integrated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-integration:
    name: Statistics + Radar / Check and Tests (no build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Statistics tests
        run: npm run test:statistics
      - name: Radar backend tests
        run: npm run test:radar
